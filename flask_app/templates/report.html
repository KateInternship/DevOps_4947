<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Heartbeat Report</title>
  <style>
    table { border-collapse: collapse; width: 50%; margin: 20px auto; }
    th, td { border: 1px solid #999; padding: 8px; text-align: center; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h1 style="text-align:center">Звіт Heartbeat</h1>
  <table>
    <tr><th>Хост</th><th>IP</th><th>Записів</th></tr>
    {% for host, ip, cnt in rows %}
      <tr>
        <td>{{ host }}</td>
        <td>{{ ip }}</td>
        <td>{{ cnt }}</td>
      </tr>
    {% endfor %}
  </table>
</body>
</html>
